<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .pointer-shadow {
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- Header -->
    <header class="max-w-6xl mx-auto w-full flex justify-between items-center mb-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-pink-500 flex items-center justify-center text-xl shadow-lg">
                🎡
            </div>
            <div>
                <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">Vòng Quay May Mắn</h1>
                <p class="text-xs text-slate-400">Quyết định ngẫu nhiên & Trúng thưởng trực quan</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button id="soundToggleBtn" onclick="toggleSound()" class="px-4 py-2 rounded-lg glass-panel hover:bg-slate-700/50 transition text-xs font-semibold flex items-center gap-2">
                <span id="soundIcon">🔊</span> <span id="soundText">Âm thanh</span>
            </button>
            <button onclick="openBulkModal()" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 transition text-xs font-semibold shadow-lg">
                📑 Nhập nhanh
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- Left Column: Wheel Canvas -->
        <div class="lg:col-span-7 flex flex-col items-center justify-center glass-panel p-6 rounded-3xl relative overflow-hidden">
            <div class="relative flex items-center justify-center my-4">
                <!-- Pointer - SỬA LỖI XOAY MŨI TÊN Ở ĐÂY -->
                <div class="absolute -top-3 z-20 pointer-shadow">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="#ef4444" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </div>
                
                <!-- Canvas Wheel -->
                <canvas id="wheelCanvas" width="800" height="800" class="w-[320px] h-[320px] sm:w-[440px] sm:h-[440px] max-w-full aspect-square"></canvas>

                <!-- Center Spin Button -->
                <button onclick="spinWheel()" id="centerSpinBtn" class="absolute z-10 w-20 h-20 rounded-full bg-amber-400 hover:bg-amber-300 text-slate-900 font-extrabold text-sm uppercase tracking-wider flex flex-col items-center justify-center shadow-2xl transition transform active:scale-95 border-4 border-slate-900">
                    <span>QUAY</span>
                    <span class="text-[10px]">►</span>
                </button>
            </div>

            <button onclick="spinWheel()" id="mainSpinBtn" class="w-full mt-4 py-3.5 rounded-xl bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 font-bold text-lg hover:opacity-90 transition shadow-lg flex items-center justify-center gap-2">
                <span>🔄 Bắt đầu quay</span>
            </button>
        </div>

        <!-- Right Column: Settings & History -->
        <div class="lg:col-span-5 flex flex-col gap-6">
            
            <!-- Items Manager -->
            <div class="glass-panel p-5 rounded-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold flex items-center gap-2 text-slate-200">
                        <span>⚙️ Danh sách lựa chọn</span>
                        <span id="itemCountBadge" class="bg-indigo-500/20 text-indigo-300 text-xs px-2 py-0.5 rounded-full font-mono">0</span>
                    </h2>
                    <div class="flex items-center gap-1">
                        <button onclick="shuffleItems()" title="Trộn danh sách" class="p-1.5 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-white transition text-sm">🔀</button>
                        <button onclick="resetToDefault()" title="Khôi phục mặc định" class="p-1.5 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-white transition text-sm">🔄</button>
                        <button onclick="clearAllItems()" title="Xóa tất cả" class="p-1.5 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-red-400 transition text-sm">🗑️</button>
                    </div>
                </div>

                <!-- Add Input -->
                <div class="flex gap-2 mb-4">
                    <input type="text" id="newItemInput" placeholder="Nhập mục mới..." onkeyup="handleKeyPress(event)" class="flex-1 bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-indigo-500 transition">
                    <button onclick="addItem()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-4 py-2 rounded-xl text-sm transition">
                        + Thêm
                    </button>
                </div>

                <!-- Controls -->
                <div class="grid grid-cols-2 gap-3 mb-4 text-xs">
                    <label class="flex items-center gap-2 bg-slate-900/40 p-2.5 rounded-xl cursor-pointer hover:bg-slate-900/60 transition">
                        <input type="checkbox" id="removeOnWin" class="rounded border-slate-700 text-indigo-600 focus:ring-0">
                        <span>Tự xóa mục đã trúng</span>
                    </label>
                    <div class="flex items-center justify-between bg-slate-900/40 p-2.5 rounded-xl">
                        <span>Thời gian quay</span>
                        <select id="spinDuration" class="bg-transparent font-semibold focus:outline-none text-right cursor-pointer">
                            <option value="3" class="bg-slate-800">3 giây</option>
                            <option value="5" selected class="bg-slate-800">5 giây</option>
                            <option value="8" class="bg-slate-800">8 giây</option>
                        </select>
                    </div>
                </div>

                <!-- Items List -->
                <div id="itemsContainer" class="max-h-56 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                    <!-- Dynamic items will be inserted here -->
                </div>
            </div>

            <!-- Winner History -->
            <div class="glass-panel p-5 rounded-2xl">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold flex items-center gap-2 text-slate-200">
                        <span>📑 Lịch sử trúng thưởng</span>
                    </h2>
                    <button onclick="clearHistory()" class="text-xs text-slate-400 hover:text-red-400 transition">Xóa lịch sử</button>
                </div>
                <div id="historyContainer" class="max-h-36 overflow-y-auto space-y-1.5 text-sm pr-1">
                    <p class="text-xs text-slate-500 italic">Chưa có lượt quay nào.</p>
                </div>
            </div>

        </div>
    </main>

    <!-- Winner Modal -->
    <div id="winnerModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="glass-panel bg-slate-900 border border-slate-700 p-8 rounded-3xl max-w-sm w-full text-center relative transform scale-90 transition-transform duration-300" id="winnerModalContent">
            <div class="text-5xl mb-3">🎉</div>
            <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-1">Kết quả trúng thưởng</h3>
            <div id="winnerResultText" class="text-2xl font-black text-amber-400 my-4 break-words">---</div>
            <button onclick="closeWinnerModal()" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-sm transition">
                Xác nhận
            </button>
        </div>
    </div>

    <!-- Bulk Input Modal -->
    <div id="bulkModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="glass-panel bg-slate-900 border border-slate-700 p-6 rounded-3xl max-w-md w-full m-4">
            <h3 class="text-lg font-bold mb-2">Nhập nhanh danh sách</h3>
            <p class="text-xs text-slate-400 mb-3">Nhập các lựa chọn, mỗi mục nằm trên một dòng riêng biệt:</p>
            <textarea id="bulkInputText" rows="8" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 mb-4 font-sans"></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="closeBulkModal()" class="px-4 py-2 rounded-xl text-xs font-semibold hover:bg-slate-800 transition">Hủy</button>
                <button onclick="saveBulkItems()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold transition">Lưu danh sách</button>
            </div>
        </div>
    </div>

    <!-- Web Audio & Logic JavaScript -->
    <script>
        // Danh sách mặc định ban đầu
        const DEFAULT_ITEMS = [
            'C.Liên Giàu 369k 🏆', 'C.Liên Nghèo 239k 🥈', 'A.Sỹ Nghèo 239k 🥉', 
            'A.Sỹ Giàu 239k 👕', 'Linh Giàu 369k 🔑', 'Linh Nghèo 239k 🎟️', 
            'Phương Giàu 369k 🍀', 'Phương Nghèo 239k ☕', 'Đông Nghèo 239k 🐁', 'Đông Giàu 369k 🐀'
        ];

        const PALETTE = [
            '#ef4444', '#f97316', '#f59e0b', '#10b981', 
            '#06b6d4', '#3b82f6', '#6366f1', '#8b5cf6', '#ec4899'
        ];

        let items = [];
        let history = [];
        let soundEnabled = true;

        // Canvas Variable
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        let currentAngle = 0;
        let isSpinning = false;

        // Sound System (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTickSound() {
            if (!soundEnabled) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }

        function playWinSound() {
            if (!soundEnabled) return;
            try {
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.1 + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + idx * 0.1);
                    osc.stop(audioCtx.currentTime + idx * 0.1 + 0.3);
                });
            } catch (e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundIcon').innerText = soundEnabled ? '🔊' : '🔇';
            document.getElementById('soundText').innerText = soundEnabled ? 'Âm thanh' : 'Tắt tiếng';
        }

        // Tải dữ liệu từ LocalStorage hoặc khôi phục mặc định nếu rỗng
        function loadItems() {
            let savedItems = null;
            try {
                savedItems = JSON.parse(localStorage.getItem('wheel_items'));
            } catch (e) {
                console.error("Lỗi đọc dữ liệu localStorage:", e);
            }

            // Nếu không có dữ liệu HOẶC mảng bị rỗng [] -> lấy mảng DEFAULT_ITEMS
            if (!savedItems || !Array.isArray(savedItems) || savedItems.length === 0) {
                saveItemsToStorage(DEFAULT_ITEMS);
                return [...DEFAULT_ITEMS];
            }

            return savedItems;
        }

        // Hàm lưu danh sách vào LocalStorage
        function saveItemsToStorage(itemsArray) {
            localStorage.setItem('wheel_items', JSON.stringify(itemsArray));
        }

        function saveItems(newItems) {
            items = newItems;
            saveItemsToStorage(items);
            renderItemList();
            drawWheel();
        }

        function resetToDefault() {
            saveItems([...DEFAULT_ITEMS]);
        }

        function renderItemList() {
            const container = document.getElementById('itemsContainer');
            document.getElementById('itemCountBadge').innerText = items.length;
            container.innerHTML = '';

            items.forEach((item, index) => {
                const color = PALETTE[index % PALETTE.length];
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between bg-slate-900/60 border border-slate-800 rounded-xl p-2.5 hover:border-slate-700 transition group';
                div.innerHTML = `
                    <div class="flex items-center gap-2.5 overflow-hidden">
                        <span class="w-3 h-3 rounded-full flex-shrink-0" style="background-color: ${color}"></span>
                        <span class="text-sm font-medium truncate">${item}</span>
                    </div>
                    <button onclick="removeItem(${index})" class="text-slate-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition px-2">✕</button>
                `;
                container.appendChild(div);
            });
        }

        function addItem() {
            const input = document.getElementById('newItemInput');
            const val = input.value.trim();
            if (val) {
                items.push(val);
                saveItems(items);
                input.value = '';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') addItem();
        }

        function removeItem(index) {
            items.splice(index, 1);
            saveItems(items);
        }

        function clearAllItems() {
            saveItems([]);
        }

        function shuffleItems() {
            for (let i = items.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [items[i], items[j]] = [items[j], items[i]];
            }
            saveItems(items);
        }

        // Canvas Wheel Drawing
        function drawWheel() {
            const numSegments = items.length;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = centerX - 20;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (numSegments === 0) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#1e293b';
                ctx.fill();
                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 28px "Plus Jakarta Sans"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Hãy thêm ô vào danh sách', centerX, centerY);
                return;
            }

            const arcSize = (2 * Math.PI) / numSegments;

            for (let i = 0; i < numSegments; i++) {
                const angle = currentAngle + i * arcSize;
                
                // Draw Sector
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
                ctx.fillStyle = PALETTE[i % PALETTE.length];
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#0f172a';
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 26px "Plus Jakarta Sans"';
                
                let text = items[i];
                if (text.length > 18) text = text.substring(0, 15) + '...';
                ctx.fillText(text, radius - 30, 10);
                ctx.restore();
            }
        }

        // Spin Logic
        function spinWheel() {
            if (isSpinning || items.length === 0) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            isSpinning = true;
            document.getElementById('mainSpinBtn').disabled = true;
            document.getElementById('centerSpinBtn').disabled = true;

            const duration = parseInt(document.getElementById('spinDuration').value) * 1000;
            const extraSpins = 5 + Math.floor(Math.random() * 5);
            const targetAngle = currentAngle + (extraSpins * 2 * Math.PI) + Math.random() * 2 * Math.PI;

            const startAngle = currentAngle;
            const startTime = performance.now();
            let lastSegmentIndex = -1;

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Cubic ease-out
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentAngle = startAngle + (targetAngle - startAngle) * easeOut;

                // Tick Sound Check
                const arcSize = (2 * Math.PI) / items.length;
                const normalizedAngle = (3 * Math.PI / 2 - currentAngle) % (2 * Math.PI);
                const positiveAngle = normalizedAngle < 0 ? normalizedAngle + 2 * Math.PI : normalizedAngle;
                const currentSegment = Math.floor(positiveAngle / arcSize);

                if (currentSegment !== lastSegmentIndex) {
                    playTickSound();
                    lastSegmentIndex = currentSegment;
                }

                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    document.getElementById('mainSpinBtn').disabled = false;
                    document.getElementById('centerSpinBtn').disabled = false;
                    
                    const winningIndex = (items.length - Math.floor((positiveAngle / (2 * Math.PI)) * items.length)) % items.length;
                    const winner = items[winningIndex];
                    
                    handleWin(winner, winningIndex);
                }
            }

            requestAnimationFrame(animate);
        }

        function handleWin(winner, index) {
            playWinSound();
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });

            // Update Winner History
            history.unshift(winner);
            renderHistory();

            // Open Modal
            document.getElementById('winnerResultText').innerText = winner;
            const modal = document.getElementById('winnerModal');
            const content = document.getElementById('winnerModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-90');
            }, 10);

            // Auto Remove Option
            if (document.getElementById('removeOnWin').checked) {
                items.splice(index, 1);
                saveItems(items);
            }
        }

        function closeWinnerModal() {
            const modal = document.getElementById('winnerModal');
            const content = document.getElementById('winnerModalContent');
            modal.classList.add('opacity-0');
            content.classList.add('scale-90');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function renderHistory() {
            const container = document.getElementById('historyContainer');
            if (history.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-500 italic">Chưa có lượt quay nào.</p>';
                return;
            }
            container.innerHTML = history.map((h, i) => `
                <div class="flex items-center justify-between text-xs bg-slate-900/40 p-2 rounded-lg">
                    <span class="text-slate-300 font-medium">#${history.length - i} ${h}</span>
                    <span class="text-amber-400 font-bold">Trúng</span>
                </div>
            `).join('');
        }

        function clearHistory() {
            history = [];
            renderHistory();
        }

        // Bulk Modal Functions
        function openBulkModal() {
            document.getElementById('bulkInputText').value = items.join('\n');
            document.getElementById('bulkModal').classList.remove('hidden');
        }

        function closeBulkModal() {
            document.getElementById('bulkModal').classList.add('hidden');
        }

        function saveBulkItems() {
            const text = document.getElementById('bulkInputText').value;
            const newItems = text.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            saveItems(newItems);
            closeBulkModal();
        }

        // Initialization
        window.addEventListener('load', () => {
            items = loadItems();
            renderItemList();
            drawWheel();
        });
    </script>
</body>
</html>
